name: Claude Review

on:
  pull_request:
    types: [labeled]

jobs:
  review:
    if: github.event.label.name == 'claude-review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Review this pull request for correctness bugs and simplification opportunities, following the repo's CLAUDE.md conventions. Post findings as inline PR comments."
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
